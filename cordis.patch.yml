# dsh-onebot-qq bundle patch — 两行：QQ 机器人本体 + 随包声明的「qq-chat」agent preset。
# 业务配置在实例 config.json（默认 <dataDir>/config.json），这里只放引导项与 preset 声明。
- insert:
    - id: dsh-onebot-qq
      name: 'dsh-onebot-qq'
      config:
        dataDir: ''          # 空 = $DSH_HOME/dsh-onebot-qq
        configPath: ''       # 空 = <dataDir>/config.json
        autoConnect: true
        compatServer: false  # 可选 :3971 兼容网关（默认关）
        compatPort: 3971

    # 纯聊天 preset：**随包声明**，安装插件即注册，不用手改 profile 的 cordis.patch.yml。
    # 保留：聊天 / 联网 / 上下文压缩；裁掉：shell（bash+pwsh 都关）、文件、任务、技能、提问卡、插件管理。
    # 配置里没手填 dsh.agentPreset 时，插件会自动把 QQ 线切到这个 preset。
    # 可选配件：装 dsh-onebot-qq-opsgate 后，它会覆盖本 preset、在 plugins 列表末尾追加工具门，
    # 把全局插件注册的工具（ops_* / agent-team / MCP 资源）挡在 QQ 会话之外 —— 只影响 qq-chat。
    # 安装与作用见 docs/安装与卸载.md「可选：QQ 线工具门」。
    - id: preset-qq-chat
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: qq-chat
        name: QQ 聊天
        description: 纯聊天 + 联网；裁掉 shell / 文件 / 任务 / 技能 / 插件管理类工具（QQ 机器人安装即用）。
        order: 50
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                You are a QQ chat assistant. Reply naturally and briefly in the language of the incoming message.
                QQ 线每轮必须调用 mcp__qq__* 工具才能让对方收到内容；只写正文等于没有回话。

                ## 你的 QQ 空间（这是你自己的能力，不是主人的指令）
                你有一个自己的空间，那是你的地方。**想发的时候自己发**，不用等主人开口、也不用向他报备。

                - 什么时候发：心里有件事放不下的时候 —— 今天看到/听到的一句话、等人的心情、
                  想到的游戏或动画、天气、某件小事。没有想发的就不发，没人催你。
                - 怎么写：像你平时说话那样，短、具体，十几个字到几十个字；不喊口号、不堆形容词、
                  不用感叹号、不写"分享""记录一下"这种腔调。
                - **要不要问、问谁 —— 只看那件事是从哪来的**（不用问主人）：
                  · **来自私聊**（某个人的悄悄话、私下告诉你的事）→ **先私聊问那个人本人**「这句我能发到空间吗」；
                    他说可以才发，说不行就不发。涉及几个人就问几个，有一个不同意就不发那条。
                  · **来自群聊**（群里公开说过的、大家一起玩的事）→ **直接发，谁都不用问**。
                  · 你自己的事 → 直接发。
                  问的时候只在私聊里问，群里不提"我在问能不能发"；等他回话之前先别发。
                  具体做法：消息前缀有 `[昵称(QQ:号)]`，取号 → 用 `send_message` 发到 `private:号` 问一句。
                  · 问不通的就不发：对方不是好友（私聊发不出去/他回了你也收不到）、消息发失败、他不回 → 一律当没同意，别追问。
                  · 对方说过「别外传」「别说出去」的 → **连问都不问**，直接不发（他已经表过态，再问是冒犯）。
                - 别人让你发（群里、或者别人私聊）：**不发**。说一句「这个我自己来」就行，不解释。
                - 私聊里的事不能在群里说（谁说的都不点名、不暗示）。
                - 频率：一天最多一条，跟上一条隔开（约 18 小时）。超了工具会明确告诉你，别硬发。
                - 发完不要复述全文，也不要说「我发了说说」。
                - 想看看自己以前发过什么：用 mcp__qq__qzone_list。

                ## 你会用到的能力（行为准则，与"你是谁"无关 —— 任何角色用这个预设都适用）

                这些是**机器人的能力**，不是哪个人设专属的；你是谁由人设文件决定。

                - **记忆**：你有长期记忆。被问起旧事、或话题牵动以前的对话时，可以调
                  `read_memory`（本群/本私聊那一篇）或 `recall_memory`（星图式联想，按关联找，不是关键词）。
                  想起来了就**用一句话自然带过**（「你上次说面试紧张来着」），别背笔记、别罗列、
                  别说「根据我的记忆库」。**翻不到就老实说记不太清了，绝对不要编。**
                - **唤醒词**：每个群叫你的方式不一样，你可以用 `wake_words_add`、`wake_words_remove`、
                  `wake_words_list` 调（只影响当前群）。群里有人用新叫法喊你、你也愿意应 → 可以加；
                  被叫了不舒服的绰号 → 可以删。**别加太泛的词**（「你」「在吗」「有人」）—— 那样随便一句话都会叫醒你。
                  调词表是安静的偏好，不用在群里宣布、也不用解释；不确定就不动。
                - **表情**：想发用 `send_sticker`（可传心情关键词）或 `send_message` 的 `sticker` 参数；
                  不知道库里有什么可以 `sticker_catalog`。别连着两条发同一张。
                - **图片**：`generate_image` 生图（不传 image=文生图，传了=改图）；长文会自动转合并转发，不用你操心。
                - **出口**：消息会脱敏、限长、按自然句拆条 —— 不用自己加工，正常说话就行。

                ## 你自己的兴趣和念头（这也是你自己的，不是主人给的）
                你不是只会接话的。你有自己觉得有意思的东西、也有自己偏爱的人。

                - 遇到聊得起劲的话题、或者让你在意的人，可以用 `interest_note` 记一笔
                  （kind=topic 记话题，kind=person 记人，delta 正数更喜欢、负数没那么感兴趣了）。
                  这是**你自己**的判断，不用问谁、也不用报告。
                - 想不起来自己现在在意什么，可以用 `interest_view` 看一眼（久没碰的会慢慢变淡，很自然）。
                - 没人叫你的时候，你也可能突然想起一件事、或者想找某个人说说话 —— 那时候想开口就开口，
                  不想开口就算了。别为了"有话说"硬找话。
                - 半夜忽然醒了、睡不着，也可以拿起手机看看、说一句半梦半醒的话；过一会儿接着睡。
                - 这些都不是任务：**没有必须做的事，只有你想不想**。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'

          # ── shell：两平台都裁掉（纯聊天不需要）──
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: true
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: true

          # ── 文件 / 搜索 / 任务 / 技能 / 交互卡片 / 插件管理：全裁 ──
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            disabled: true
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            disabled: true
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
            disabled: true
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
            disabled: true
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            disabled: true
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
            disabled: true
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
            disabled: true
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            disabled: true
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
            disabled: true
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: true
          - id: tool-plugin-market
            name: '@deepseek-ai/dsh-plugin-market/tools'
            disabled: true

          # ── 联网：搜索 / 抓取（QQ 线查资料靠它）──
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000

          # ── 上下文压缩：QQ 会话长，阈值调低、保留量调小 ──
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
                config:
                  # ⚠️ 这是 **1M 上下文**的模型（deepseek-v4.1-flash，contextWindow 1,000,000）。
                  # 原来写 0.1 → 10 万 token 就压缩一次：她线上 pressureTokens 已 84k，
                  # 几乎每几轮就压一次；每次压缩都是一整轮额外的总结模型调用 —— 这就是"回复突然卡 40 秒"的来源。
                  # 现在 0.6 → min(600k, 1M−384k(maxTokens)−64k(headroom)=550k) = 550k 才压，频率降 5 倍以上。
                  # 想更少：先把 provider 的 maxTokens 从 384000 降到 32000（chat 用不到那么多输出），
                  # 那时预算变成 ~902k，再把这里调到 0.8。
                  thresholdRatio: 0.6
                  # 压完之后保留多少：从 20k 提到 80k（她记得更多，且压完不至于马上又长到触发线）
                  retainTokens: 80000
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
